<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DF246" />
      <stop offset="100%" stop-color="#65DC1C" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Dark Studio Canvas Background -->
  <rect width="500" height="500" rx="36" fill="#070D10"/>

  <!-- Outer White Crescent Arc -->
  <path d="M 120 405 C 50 320 50 170 145 90 C 240 10 370 45 425 105 C 345 55 210 50 135 125 C 65 195 70 320 120 405 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Middle Electric Neon Lime Crescent Arc -->
  <path d="M 160 445 C 80 375 75 220 175 140 C 240 85 330 80 380 100 C 315 95 215 120 155 185 C 95 250 105 385 160 445 Z" fill="url(#limeGlow)" filter="url(#neonBlur)" />

  <!-- Lower White Accent Crescent Arc -->
  <path d="M 155 305 C 190 350 260 410 450 340 C 350 410 230 385 155 305 Z" fill="#FFFFFF" />

  <!-- Brand Typography: AbrahaM.s -->
  <g transform="translate(160, 275)">
    <!-- AbrahaM (Electric Lime) -->
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-style="italic" font-size="58" fill="url(#limeGlow)" letter-spacing="-1">AbrahaM</text>
    <!-- .s (Pure White) -->
    <text x="280" y="0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-style="italic" font-size="58" fill="#FFFFFF">.s</text>
  </g>

  <!-- Subtitle: 3d Ai Animation -->
  <text x="180" y="315" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-style="italic" font-size="24" fill="#FFFFFF" letter-spacing="0.5">3d Ai Animation</text>

  <!-- Wireframe Monitor & 3D Printer Tech Glyphs -->
  <g transform="translate(360, 280) scale(0.75)" stroke="#74E023" stroke-width="2.5" fill="none">
    <!-- Monitor with 3D Isometric Cube -->
    <rect x="0" y="0" width="46" height="34" rx="3" />
    <line x1="23" y1="34" x2="23" y2="44" />
    <line x1="12" y1="44" x2="34" y2="44" />
    <!-- Mini Isometric Cube inside screen -->
    <path d="M 23 10 L 33 16 L 33 28 L 23 34 L 13 28 L 13 16 Z" />
    <path d="M 23 10 L 23 22 L 33 16" />
    <path d="M 23 22 L 13 16" />
    <path d="M 23 22 L 23 34" />

    <!-- 3D Printer Glyph -->
    <g transform="translate(54, 0)">
      <rect x="0" y="0" width="42" height="42" rx="4" />
      <line x1="6" y1="12" x2="36" y2="12" />
      <line x1="21" y1="12" x2="21" y2="22" />
      <polygon points="18,22 24,22 21,27" fill="#74E023" />
      <rect x="12" y="32" width="18" height="6" rx="1" fill="#74E023" opacity="0.6" />
    </g>
  </g>
</svg>
