<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04080A" />
      <stop offset="50%" stop-color="#091317" />
      <stop offset="100%" stop-color="#050C0F" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94FF47" />
      <stop offset="100%" stop-color="#55C912" />
    </linearGradient>
    <radialGradient id="radialCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8DF246" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8DF246" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Studio Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Volumetric Center Glow -->
  <circle cx="600" cy="400" r="384" fill="url(#radialCore)" />

  <!-- Studio Viewport Geometry / Render Grids -->
  <g stroke="#8DF246" stroke-opacity="0.2" stroke-width="1.2">
    <!-- Camera Target Crosshairs -->
    <line x1="550" y1="400" x2="650" y2="400" />
    <line x1="600" y1="350" x2="600" y2="450" />
    <circle cx="600" cy="400" r="120" stroke-dasharray="4 8" />
    <circle cx="600" cy="400" r="220" stroke-opacity="0.1" stroke-dasharray="2 12" />
    <circle cx="600" cy="400" r="340" stroke-opacity="0.05" />
  </g>

  <!-- Central 3D Mesh Representation -->
  
    <!-- Cinematic Kinetic Motion Lines / Animation Visual -->
    <g transform="translate(380, 250)">
      <path d="M 0 150 C 100 0, 340 300, 440 150" fill="none" stroke="#8DF246" stroke-width="6" filter="url(#glow)"/>
      <path d="M 20 180 C 120 30, 360 330, 460 180" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M -20 120 C 80 -30, 320 270, 420 120" fill="none" stroke="#8DF246" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>
      <!-- Dynamic Keyframe Vectors -->
      <circle cx="100" cy="90" r="12" fill="url(#primaryGlow)" filter="url(#glow)"/>
      <circle cx="220" cy="150" r="16" fill="#FFFFFF" filter="url(#glow)"/>
      <circle cx="340" cy="210" r="12" fill="url(#primaryGlow)" filter="url(#glow)"/>
    </g>
  

  <!-- Technical Top Bar Overlay -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="160" height="26" rx="4" fill="#0E191E" stroke="#8DF246" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="5" fill="#8DF246"/>
    <text x="28" y="18" font-family="'Segoe UI', monospace" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">ABRAHAM STUDIO</text>
  </g>

  <g transform="translate(960, 60)">
    <text x="180" y="18" text-anchor="end" font-family="'Segoe UI', monospace" font-size="12" fill="#8DF246" letter-spacing="2">3D ASSET // GOOGLE VEO & BLENDER</text>
  </g>

  <!-- Technical Coordinate Metadata Box (Bottom Left) -->
  <g transform="translate(60, 690)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="0.5">METAMORPHOSIS</text>
    <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#8DF246" letter-spacing="1">AI & HYBRID MOTION DESIGN — Google Veo & Blender</text>
    <text x="0" y="44" font-family="'Segoe UI', monospace" font-size="11" fill="#758B96" letter-spacing="1">VERTEX DENSITY: OPTIMIZED TOPOLOGY // 4K HIGH POLY TEXTURING</text>
  </g>

  <!-- Viewport HUD Overlay Box (Bottom Right) -->
  <g transform="translate(980, 700)">
    <rect x="0" y="0" width="160" height="42" rx="4" fill="#0C161B" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <text x="16" y="20" font-family="'Segoe UI', monospace" font-size="11" fill="#FFFFFF">RENDER ENGINE</text>
    <text x="16" y="34" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" fill="#8DF246">CYCLES / OCTANE</text>
  </g>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="760" rx="12" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" fill="none"/>
</svg>