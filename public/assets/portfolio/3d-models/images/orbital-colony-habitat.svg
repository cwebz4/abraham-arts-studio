<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04080A" />
      <stop offset="50%" stop-color="#091317" />
      <stop offset="100%" stop-color="#050C0F" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94FF47" />
      <stop offset="100%" stop-color="#55C912" />
    </linearGradient>
    <radialGradient id="radialCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60DB1E" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#60DB1E" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Studio Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Volumetric Center Glow -->
  <circle cx="600" cy="400" r="384" fill="url(#radialCore)" />

  <!-- Studio Viewport Geometry / Render Grids -->
  <g stroke="#60DB1E" stroke-opacity="0.2" stroke-width="1.2">
    <!-- Camera Target Crosshairs -->
    <line x1="550" y1="400" x2="650" y2="400" />
    <line x1="600" y1="350" x2="600" y2="450" />
    <circle cx="600" cy="400" r="120" stroke-dasharray="4 8" />
    <circle cx="600" cy="400" r="220" stroke-opacity="0.1" stroke-dasharray="2 12" />
    <circle cx="600" cy="400" r="340" stroke-opacity="0.05" />
  </g>

  <!-- Central 3D Mesh Representation -->
  
    <!-- 3D Environment / Sci-Fi Station Architecture -->
    <g transform="translate(360, 240)">
      <!-- Ring Structure -->
      <ellipse cx="240" cy="160" rx="220" ry="90" fill="none" stroke="#60DB1E" stroke-width="4" filter="url(#glow)"/>
      <ellipse cx="240" cy="160" rx="170" ry="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
      <ellipse cx="240" cy="160" rx="80" ry="32" fill="#11222A" stroke="#60DB1E" stroke-width="3"/>
      <!-- Spokes and Modules -->
      <line x1="240" y1="70" x2="240" y2="250" stroke="#60DB1E" stroke-width="3"/>
      <line x1="20" y1="160" x2="460" y2="160" stroke="#60DB1E" stroke-width="3"/>
      <line x1="84" y1="96" x2="396" y2="224" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
      <line x1="84" y1="224" x2="396" y2="96" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
      <!-- Geodesic Domes -->
      <circle cx="240" cy="160" r="40" fill="url(#primaryGlow)" opacity="0.8" filter="url(#glow)"/>
      <circle cx="20" cy="160" r="14" fill="#0E191E" stroke="#60DB1E" stroke-width="2"/>
      <circle cx="460" cy="160" r="14" fill="#0E191E" stroke="#60DB1E" stroke-width="2"/>
      <circle cx="240" cy="70" r="14" fill="#0E191E" stroke="#60DB1E" stroke-width="2"/>
      <circle cx="240" cy="250" r="14" fill="#0E191E" stroke="#60DB1E" stroke-width="2"/>
    </g>
  

  <!-- Technical Top Bar Overlay -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="160" height="26" rx="4" fill="#0E191E" stroke="#60DB1E" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="5" fill="#60DB1E"/>
    <text x="28" y="18" font-family="'Segoe UI', monospace" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">ABRAHAM STUDIO</text>
  </g>

  <g transform="translate(960, 60)">
    <text x="180" y="18" text-anchor="end" font-family="'Segoe UI', monospace" font-size="12" fill="#60DB1E" letter-spacing="2">3D ASSET // BLENDER 3D</text>
  </g>

  <!-- Technical Coordinate Metadata Box (Bottom Left) -->
  <g transform="translate(60, 690)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="0.5">ORBITAL COLONY HABITAT</text>
    <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#60DB1E" letter-spacing="1">SCI-FI ENVIRONMENT — Blender 3D</text>
    <text x="0" y="44" font-family="'Segoe UI', monospace" font-size="11" fill="#758B96" letter-spacing="1">VERTEX DENSITY: OPTIMIZED TOPOLOGY // 4K HIGH POLY TEXTURING</text>
  </g>

  <!-- Viewport HUD Overlay Box (Bottom Right) -->
  <g transform="translate(980, 700)">
    <rect x="0" y="0" width="160" height="42" rx="4" fill="#0C161B" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <text x="16" y="20" font-family="'Segoe UI', monospace" font-size="11" fill="#FFFFFF">RENDER ENGINE</text>
    <text x="16" y="34" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" fill="#60DB1E">CYCLES / OCTANE</text>
  </g>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="760" rx="12" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" fill="none"/>
</svg>